<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Daily Command Center V2</title>
<style>body{margin:0;background:#09101d;color:#f5f7fb;font-family:Arial}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px}button{padding:12px 18px;border:0;border-radius:9px;background:#e6bd61;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.level{background:#121c2e;border:1px solid #293650;border-radius:12px;padding:16px}.label{color:#94a3b8;font-size:11px}.value{font-size:28px;font-weight:bold;margin-top:7px}.gold{color:#e6bd61}.green{color:#43d58a}.red{color:#ff6b6b}.tf{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}table{width:100%;border-collapse:collapse;background:#121c2e}td,th{padding:10px;border-bottom:1px solid #293650;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:#94a3b8;font-size:12px}@media(max-width:800px){.grid,.tf,.levels{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid,.tf,.levels{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="top"><div><h1>🟡 GOLD DAILY COMMAND CENTER V2</h1><div class="muted">XAU/USD · Multi-Timeframe · Macro · Regime</div></div><button onclick="load('/api/refresh',{method:'POST'})">↻ Refresh Real Data</button></div><p id="status" class="muted">Loading…</p><section class="grid" id="cards"></section><h2>Multi-Timeframe Alignment</h2><section class="tf" id="tf"></section><h2>Trading Research Zone</h2><section class="levels" id="levels"></section><h2>Macro Dashboard</h2><section class="grid" id="macro"></section><p class="muted">Research only. Broker XAU/USD feeds may differ. Macro series are daily and can lag intraday.</p></main>
<script>const $=x=>document.getElementById(x),money=x=>"$"+Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),pc=x=>Number(x).toFixed(1)+"%",cl=x=>x==="BUY"||x==="BULLISH"?"green":x==="SELL"||x==="BEARISH"?"red":"gold";
function card(a,b,c){return `<div class="card"><div class="label">${a}</div><div class="value ${c||''}">${b}</div></div>`}
function render(d){$("cards").innerHTML=[["XAU/USD",money(d.price),"gold"],["SIGNAL",d.signal,cl(d.signal)],["GOLD SCORE",d.score.toFixed(1),cl(d.signal)],["CONFIDENCE",pc(d.confidence),cl(d.signal)],["REGIME",d.regime,""],["MACRO SCORE",d.macro_score.toFixed(1),""],["DAILY RSI",d.daily.rsi.toFixed(1),""],["ATR",money(d.daily.atr||0),""]].map(x=>card(...x)).join("");
$("tf").innerHTML=[["Daily",d.daily],["4H",d["4h"]],["1H",d["1h"]],["15M",d["15m"]]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${cl(x[1].trend)}">${x[1].trend}</div><div>Score ${x[1].score.toFixed(1)} · RSI ${x[1].rsi.toFixed(1)}</div></div>`).join("");
$("levels").innerHTML=[["Support",d.support],["Resistance",d.resistance],["Entry Low",d.entry_low],["Entry High",d.entry_high],["SL / TP1 / TP2",money(d.sl)+" / "+money(d.tp1)+" / "+money(d.tp2)]].map(x=>`<div class="level"><div class="label">${x[0]}</div><div class="value">${typeof x[1]==="number"?money(x[1]):x[1]}</div></div>`).join("");
$("macro").innerHTML=[["US 10Y",d.us10.toFixed(2)+"%"],["10Y REAL",d.real10.toFixed(2)+"%"],["BROAD USD",d.usd.toFixed(2)],["10Y BREAKEVEN",d.breakeven.toFixed(2)+"%"]].map(x=>card(...x)).join("");$("status").textContent="Last refresh: "+new Date(d.updated).toLocaleString()}
async function load(u="/api/dashboard",o={}){ $("status").textContent="กำลังดึงข้อมูลจริงและคำนวณ…";let r=await fetch(u,o),d=await r.json();if(d.error){$("status").textContent="Error: "+d.error;return}render(d)}load();</script></body></html>
